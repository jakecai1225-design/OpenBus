<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>openbus UI 原型 — 全交互预览</title>
<link rel="stylesheet" href="css/ui-prototype.css">
</head>
<body>

<!-- 场景切换器（动态加载） -->
<div id="partial-scenario-bar"></div>

<!-- 窗口 -->
<div class="window">
  <!-- 菜单栏（动态加载） -->
  <div id="partial-menubar"></div>

  <!-- 主体 -->
  <div class="main-body">
    <!-- 左侧栏（动态加载） -->
    <div id="partial-left-dock"></div>
    <!-- 中央编辑区（动态加载） -->
    <div id="partial-center-area"></div>
    <!-- 右侧栏（动态加载） -->
    <div id="partial-right-dock"></div>
  </div>

  <!-- 底部 Dock + 状态栏（动态加载） -->
  <div id="partial-bottom-dock"></div>
</div>

<!-- 对话框（动态加载） -->
<div id="partial-dialogs"></div>

<!-- 右键菜单 + 拆分视图模板（动态加载） -->
<div id="partial-overlays"></div>

<script src="js/ui-prototype.js"></script>
<script src="js/ui-loader.js"></script>
</body>
</html>
