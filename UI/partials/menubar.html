<!-- 菜单栏 -->
<div class="menubar">
  <div class="menu-items">
    <div class="menu-item" data-menu="file" onclick="toggleMenu(this)">文件(F)
      <div class="menu-dropdown">
        <div class="item" onclick="closeMenus()">打开文件...<span class="shortcut">Ctrl+O</span></div>
        <div class="item" onclick="closeMenus()">打开工程...<span class="shortcut">Ctrl+Shift+O</span></div>
        <div class="sep"></div>
        <div class="item" onclick="closeMenus()">退出<span class="shortcut">Alt+F4</span></div>
      </div>
    </div>
    <div class="menu-item" data-menu="view" onclick="toggleMenu(this)">视图(V)
      <div class="menu-dropdown">
        <div class="item checked" onclick="toggleCheck(this);closeMenus()">左侧栏</div>
        <div class="item checked" onclick="toggleCheck(this);closeMenus()">底部栏</div>
        <div class="item checked" onclick="toggleCheck(this);closeMenus()">右侧栏</div>
        <div class="sep"></div>
        <div class="item" onclick="closeMenus()">重置布局</div>
      </div>
    </div>
    <div class="menu-item" data-menu="tools" onclick="toggleMenu(this)">工具(T)
      <div class="menu-dropdown">
        <div class="item" onclick="closeMenus()">● 录制<span class="shortcut">Ctrl+R</span></div>
        <div class="item" onclick="closeMenus()">▶ 发送<span class="shortcut">Space</span></div>
        <div class="item" onclick="closeMenus()">⏹ 停止发送</div>
        <div class="sep"></div>
        <div class="item" onclick="closeMenus()">清空 Trace</div>
        <div class="item checked" onclick="toggleCheck(this);closeMenus()">自动滚动</div>
        <div class="item" onclick="closeMenus()">模拟器开关</div>
      </div>
    </div>
    <div class="menu-item" data-menu="help" onclick="toggleMenu(this)">帮助(H)
      <div class="menu-dropdown">
        <div class="item" onclick="setScenario('about');closeMenus()">关于 openbus</div>
        <div class="sep"></div>
        <div class="item" onclick="closeMenus()">文档</div>
        <div class="item" onclick="closeMenus()">官方网站</div>
        <div class="item" onclick="closeMenus()">GitHub 仓库</div>
        <div class="sep"></div>
        <div class="item" onclick="closeMenus()">报告问题</div>
        <div class="item" onclick="document.getElementById('update-dialog').classList.add('show');closeMenus()">检查更新</div>
        <div class="item" onclick="document.getElementById('release-dialog').classList.add('show');closeMenus()">发版记录</div>
        <div class="sep"></div>
        <div class="item" onclick="document.getElementById('shortcut-dialog').classList.add('show');closeMenus()">快捷键</div>
        <div class="item" onclick="document.getElementById('license-dialog').classList.add('show');closeMenus()">许可证</div>
        <div class="sep"></div>
        <div class="item" onclick="document.getElementById('biz-dialog').classList.add('show');closeMenus()">商业合作</div>
      </div>
    </div>
  </div>
  <div class="win-btns">
    <div class="win-btn" title="最小化">&#9472;</div>
    <div class="win-btn" title="最大化">&#9633;</div>
    <div class="win-btn close" title="关闭">&#10005;</div>
  </div>
</div>
